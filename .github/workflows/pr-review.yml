name: PR Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Qodo Review (Gemini API)
    # Do not run on bot-generated events to avoid loops
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Run Qodo PR Agent
        id: pr_agent
        uses: the-pr-agent/pr-agent@main
        env:
          # GitHub token provided automatically by GitHub Actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Google Gemini API Key from Google AI Studio
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Gemini Model Configuration (LiteLLM format: gemini/<model-name>)
          CONFIG.MODEL: "gemini/gemini-3.8-flash"
          CONFIG.FALLBACK_MODELS: "[]"

          # Automated Review Behavior
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'

[workspace]
resolver = "3"

members = [
    "crates/types",
    "crates/record",
    "crates/journal",
    "crates/subscription",
    "crates/sharding",
    "crates/storage-core",
    "crates/protocol-core",
    "crates/bench",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Haris", "Shaunak"]

[workspace.dependencies]
bitflags = "2"
bytes = "1"
crc32c = "0.6"
lz4_flex = "0.11"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v7", "serde"] }
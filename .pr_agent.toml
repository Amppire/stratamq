[pr_reviewer]
num_code_suggestions = 6
require_score_review = true
require_tests_review = true
require_estimate_effort_to_review = false
inline_code_comments = false
extra_instructions = """
- Keep all explanations concise (max 2-3 sentences per suggestion).
- Focus strictly on functional bugs, memory safety, protocol framing correctness, and error propagation.
- Disregard minor stylistic nitpicks that a linter or formatter would catch.
"""

[pr_code_suggestions]
num_code_suggestions_per_chunk = 3
suggestions_score_threshold = 7
focus_only_on_problems = true
committable_code_suggestions = false

[ignore]
glob = [
  "Cargo.lock",
  "benchmarks/results/**",
  "*.md"
]
